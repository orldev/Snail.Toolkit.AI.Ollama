name: Watch Ollama

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare with the last reviewed release and API spec
        run: .github/ollama/check.sh
        env:
          GH_TOKEN: ${{ github.token }}
